<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plate recognition</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1b2230; }
    select, button { font: inherit; padding: .6rem; width: 100%; margin-bottom: 1rem; }
    button { background: #f2c230; border: 0; border-radius: 6px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #drop { border: 2px dashed #aab; border-radius: 8px; padding: 2rem 1rem; text-align: center; cursor: pointer; margin-bottom: 1rem; }
    img { max-width: 100%; margin-bottom: 1rem; border-radius: 6px; }
    .plate { border: 2px solid #1b2230; border-radius: 6px; padding: .2rem .8rem; font: 700 1.5rem monospace; letter-spacing: .1em; }
    .err { color: #b3261e; }
  </style>
</head>
<body>
  <h1>Read a number plate</h1>
  <select id="camera"><option value="">Loading cameras...</option></select>
  <div id="drop">Drop an image here, or click to choose a file</div>
  <input type="file" id="file" accept="image/*" hidden>
  <img id="preview" alt="Selected image" hidden>
  <button id="go" disabled>Read plate</button>
  <div id="result"></div>

<script>
  const CAMERAS_URL = "{% url 'cameras' %}";
  const CAPTURES_URL = "{% url 'captures' %}";
  const DETAIL_URL = "{% url 'capture-detail' '00000000-0000-0000-0000-000000000000' %}";

  const $ = (id) => document.getElementById(id);
  const [camera, drop, fileInput, preview, go, result] = ["camera", "drop", "file", "preview", "go", "result"].map($);
  let file = null, key = null;

  const newKey = () => crypto.randomUUID();
  const refresh = () => { go.disabled = !(file && camera.value); };
  const show = (html) => { result.innerHTML = html; };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function setFile(f) {
    if (!f || !f.type.startsWith("image/")) return;
    file = f;
    key = newKey();
    preview.src = URL.createObjectURL(f);
    preview.hidden = false;
    drop.textContent = f.name + " (click to choose another)";
    refresh();
  }

  function render(c) {
    if (c.status === "failed") return show(`<p class="err">Processing failed: ${esc(c.error)}</p>`);
    const plates = c.plates.map((p) =>
      `<p><span class="plate">${esc(p.license_plate || "?")}</span> ${Math.round(p.confidence * 100)}%` +
      `${p.status === "ok" ? "" : " - " + esc(p.status.replaceAll("_", " "))}</p>`).join("");
    show(`<p>${esc(c.outcome.replaceAll("_", " "))}</p>${plates}<img src="${esc(c.processed_image || c.image)}" alt="Result">`);
  }

  async function submit() {
    go.disabled = true;
    go.textContent = "Reading...";
    result.replaceChildren();
    const form = new FormData();
    form.append("camera", camera.value);
    form.append("image", file);
    try {
      let res = await fetch(CAPTURES_URL, { method: "POST", body: form, headers: { "Idempotency-Key": key } });
      let data = await res.json();
      if (!res.ok) throw new Error(data.error);
      const url = DETAIL_URL.replace("00000000-0000-0000-0000-000000000000", data.uuid);
      const startTime = Date.now();
      const TIMEOUT_MS = 60000;
      let delay = 1000; // start at 1s
      const MAX_DELAY = 5000; // cap at 5s
      while (["pending", "processing"].includes(data.status)) {
        if (Date.now() - startTime > TIMEOUT_MS) {
          throw new Error("Processing timed out. Please check the result later.");
        }
        const elapsed = Math.round((Date.now() - startTime) / 1000);
        show(`<p>Processing... ${elapsed}s</p>`);
        await new Promise((r) => setTimeout(r, delay));
        delay = Math.min(delay * 1.5, MAX_DELAY); // exponential backoff: 1s → 1.5s → 2.25s → 3.3s → 5s
        data = await (await fetch(url)).json();
      }
      render(data);
    } catch (e) {
      show(`<p class="err">${esc(e.message || "Could not reach the server.")}</p>`);
    }
    go.textContent = "Read plate";
    refresh();
  }

  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => setFile(fileInput.files[0]);
  drop.ondragover = (e) => e.preventDefault();
  drop.ondrop = (e) => { e.preventDefault(); setFile(e.dataTransfer.files[0]); };
  camera.onchange = () => { key = newKey(); refresh(); };
  go.onclick = submit;

  fetch(CAMERAS_URL).then((r) => r.json()).then((d) => {
    camera.replaceChildren(new Option("Choose a camera", ""));
    d.results.forEach((c) => camera.append(new Option(`${c.code} (${c.name})`, c.code)));
  }).catch(() => camera.replaceChildren(new Option("Could not load cameras", "")));
</script>
</body>
</html>
